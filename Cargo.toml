[package]
name = "fitdata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "parquet", "nested_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "math_expressions", "regex_expressions"] }
dotenvy = "0.15.7"
futures = "0.3.34"
google-cloud-auth = "1.18.0"
google-cloud-gax = "1.15.0"
google-cloud-secretmanager-v1 = "1.14.0"
google-cloud-storage = "1.21.0"
governor = "=0.10.4"
hmac = "0.13.0"
http = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query", "http2"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

# DuckDB (C++) is big: without debug info for dependencies the dev build
# stays a few GB, and an optimized DuckDB keeps the tests quick.
[profile.dev.package."*"]
debug = false
