[package]
name = "fitdata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http2", "multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
duckdb = { version = "=1.10506.0", features = ["bundled", "parquet", "json"] }
futures = "0.3.34"
google-cloud-auth = "1.18.0"
google-cloud-bigquery-v2 = "1.1.0"
google-cloud-gax = "1.15.0"
google-cloud-secretmanager-v1 = "1.14.0"
google-cloud-storage = "1.21.0"
hmac = "0.13.0"
http = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query", "http2", "multipart"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

# DuckDB (C++) is big: without debug info for dependencies the dev build
# stays a few GB, and an optimized DuckDB keeps the tests quick.
[profile.dev.package."*"]
debug = false

[profile.dev.package.libduckdb-sys]
opt-level = 2
