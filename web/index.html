<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fitdata</title>
<script src="/vendor/echarts-5.5.1.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --s1: #2a78d6;  /* blue */
    --s2: #eb6834;  /* orange */
    --s3: #1baf7a;  /* aqua */
    --s4: #eda100;  /* yellow */
    --band: #b7d3f6;
    --shade: rgba(11, 11, 11, 0.05);
    --good: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --band: #184f95;
      --shade: rgba(255, 255, 255, 0.06);
      --good: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --band: #184f95;
    --shade: rgba(255, 255, 255, 0.06); --good: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  h2 { font-size: 15px; margin: 32px 0 12px; font-weight: 650; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button[aria-pressed="true"] { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); font-weight: 600; }
  button:hover { background: var(--shade); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px;
    padding: 12px 16px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--border); border-left: 4px solid var(--s4);
  }
  .banner[hidden] { display: none; }
  .banner a {
    color: var(--ink); font-weight: 600; text-decoration: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; background: var(--page);
  }
  .banner a:hover { background: var(--shade); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 820px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .unit { font-size: 14px; color: var(--ink-2); font-weight: 400; margin-left: 2px; }
  .tile .delta { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 8px; }
  .card h3 { font-size: 14px; font-weight: 600; margin: 0; }
  .card .sub { font-size: 12px; color: var(--muted); }
  .chart { width: 100%; height: 240px; }
  .chart.tall { height: 300px; }
  .chart.short { height: 180px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stack > .card + .card { margin-top: 12px; }
  @media (max-width: 820px) { .grid2, .grid4 { grid-template-columns: 1fr; } }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--shade); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>fitdata</h1>
    <div class="days" id="days" role="group" aria-label="Den"></div>
    <div class="spacer"></div>
    <span class="muted" id="status"></span>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>
  <section class="tiles" id="tiles" aria-label="Metriky dne"></section>

  <h2 id="day-title">Den</h2>
  <div class="stack">
    <div class="card">
      <h3>Tep</h3>
      <div class="sub">průměr za minutu, pásmo = min–max; šedě spánek, oranžově cvičení</div>
      <div class="chart tall" id="c-hr"></div>
    </div>
    <div class="card" id="sleep-card">
      <h3>Spánek</h3>
      <div class="sub" id="sleep-sub"></div>
      <div class="chart short" id="c-sleep"></div>
      <div class="legend" id="sleep-legend"></div>
    </div>
    <div class="card">
      <h3>Kroky</h3>
      <div class="sub">součet za 15 minut</div>
      <div class="chart short" id="c-steps"></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <h3>SpO₂ v noci</h3>
      <div class="sub">%</div>
      <div class="chart short" id="c-spo2"></div>
    </div>
    <div class="card">
      <h3>HRV v noci</h3>
      <div class="sub">RMSSD, ms (5min okna)</div>
      <div class="chart short" id="c-hrv"></div>
    </div>
  </div>

  <h2>Trendy</h2>
  <div class="grid4">
    <div class="card"><h3>Klidový tep</h3><div class="sub">tepů/min</div><div class="chart short" id="t-rhr"></div></div>
    <div class="card"><h3>HRV</h3><div class="sub">ms</div><div class="chart short" id="t-hrv"></div></div>
    <div class="card"><h3>Spánek</h3><div class="sub">hodiny</div><div class="chart short" id="t-sleep"></div></div>
    <div class="card"><h3>Kroky</h3><div class="sub">za den</div><div class="chart short" id="t-steps"></div></div>
  </div>

  <h2>Všechny dny</h2>
  <div class="table-wrap"><table id="table"></table></div>
</main>

<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const charts = {};
let days = [], selected = null;

const STAGES = [ // fixed categorical order
  { key: 'DEEP', label: 'Hluboký', color: '--s1' },
  { key: 'LIGHT', label: 'Lehký', color: '--s2' },
  { key: 'REM', label: 'REM', color: '--s3' },
  { key: 'AWAKE', label: 'Bdění', color: '--s4' },
];
const STAGE_ROW = { AWAKE: 3, REM: 2, LIGHT: 1, DEEP: 0 };

const fmt = (v, d = 0) => v == null ? '–' : Number(v).toLocaleString('cs-CZ', { maximumFractionDigits: d, minimumFractionDigits: d });
const hm = m => m == null ? '–' : `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, '0')} min`;
const hmShort = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, '0')}`;
const time = s => s.slice(11, 16);
const dayLabel = d => new Date(d + 'T12:00').toLocaleDateString('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric' });

// Inserts a null row after any gap longer than maxGapMin, so lines break
// instead of bridging periods with no measurements.
function withGaps(rows, maxGapMin) {
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    if (i && new Date(rows[i][0]) - new Date(rows[i - 1][0]) > maxGapMin * 60000)
      out.push([rows[i - 1][0], ...rows[i].slice(1).map(() => null)]);
    out.push(rows[i]);
  }
  return out;
}

function chart(id) {
  if (!charts[id]) charts[id] = echarts.init($(id), null, { renderer: 'svg' });
  return charts[id];
}

function base() {
  const axisLabel = { color: css('--muted'), fontSize: 11 };
  return {
    animation: false,
    textStyle: { fontFamily: 'system-ui, -apple-system, Segoe UI, sans-serif', color: css('--ink-2') },
    grid: { left: 40, right: 12, top: 14, bottom: 26 },
    tooltip: {
      trigger: 'axis', backgroundColor: css('--surface'), borderColor: css('--border'),
      textStyle: { color: css('--ink'), fontSize: 12 },
      axisPointer: { type: 'line', lineStyle: { color: css('--axis') } },
    },
    xAxis: {
      type: 'time', axisLabel: { ...axisLabel, hideOverlap: true, formatter: '{HH}:{mm}' },
      axisLine: { lineStyle: { color: css('--axis') } }, axisTick: { show: false }, splitLine: { show: false },
    },
    yAxis: {
      type: 'value', scale: true, axisLabel, splitNumber: 3,
      splitLine: { lineStyle: { color: css('--grid') } }, axisLine: { show: false },
    },
  };
}

function tiles(m, prev) {
  const items = [
    ['Klidový tep', m.resting_hr, 'tepů/min', 0, 'resting_hr'],
    ['HRV', m.hrv_ms, 'ms', 1, 'hrv_ms'],
    ['Spánek', m.sleep_minutes, null, 0, 'sleep_minutes'],
    ['Kroky', m.steps, '', 0, 'steps'],
    ['Aktivní zóny', m.azm, 'min', 0, 'azm'],
    ['SpO₂', m.spo2_avg, '%', 1, 'spo2_avg'],
    ['Dech', m.respiratory_rate, '/min', 1, 'respiratory_rate'],
    ['Aktivní kcal', m.active_kcal, 'kcal', 0, 'active_kcal'],
  ];
  $('tiles').innerHTML = items.map(([label, v, unit, d, key]) => {
    const value = unit === null ? (v == null ? '–' : `${hmShort(v)}<span class="unit">h</span>`) : `${fmt(v, d)}<span class="unit">${unit}</span>`;
    const p = prev?.[key];
    const delta = v != null && p != null
      ? `${v - p >= 0 ? '+' : '−'}${unit === null ? (Math.abs(v - p) < 60 ? `${Math.round(Math.abs(v - p))} min` : hm(Math.abs(v - p))) : fmt(Math.abs(v - p), d)} vs. předchozí den`
      : '&nbsp;';
    return `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="delta">${delta}</div></div>`;
  }).join('');
}

function hrChart(d) {
  const o = base();
  const rows = withGaps(d.heartRate, 5);
  const lo = rows.map(r => [r[0], r[1]]);
  const span = rows.map(r => [r[0], r[1] == null ? null : r[3] - r[1]]);
  const avg = rows.map(r => [r[0], r[2]]);
  const areas = [];
  if (d.sleep) areas.push([{ xAxis: d.sleep.start, itemStyle: { color: css('--shade') } }, { xAxis: d.sleep.end }]);
  for (const e of d.exercises) areas.push([{ xAxis: e.start, itemStyle: { color: css('--s2'), opacity: 0.12 } }, { xAxis: e.end }]);
  o.xAxis.min = d.range[0]; o.xAxis.max = d.range[1];
  o.tooltip.formatter = ps => {
    const r = rows[ps[0].dataIndex];
    if (r[1] == null) return '';
    return `${time(r[0])}<br>průměr <b>${r[2]}</b> tepů/min<br><span style="color:${css('--muted')}">min ${r[1]} · max ${r[3]}</span>`;
  };
  o.series = [
    { type: 'line', data: lo, stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, silent: true },
    { type: 'line', data: span, stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, areaStyle: { color: css('--band'), opacity: 0.6 }, silent: true },
    { type: 'line', data: avg, symbol: 'none', lineStyle: { width: 1.5, color: css('--s1') }, itemStyle: { color: css('--s1') },
      markArea: { silent: true, data: areas } },
  ];
  chart('c-hr').setOption(o, true);
}

function sleepChart(d) {
  const s = d.sleep;
  $('sleep-card').hidden = !s;
  if (!s) return;
  const m = d.metrics || {};
  $('sleep-sub').textContent = `${time(s.start)}–${time(s.end)} · spánek ${hm(m.sleep_minutes)} · bdění ${fmt(m.sleep_awake_minutes)} min`;
  const color = Object.fromEntries(STAGES.map(x => [x.key, css(x.color)]));
  const label = Object.fromEntries(STAGES.map(x => [x.key, x.label]));
  const o = base();
  o.grid.left = 64;
  o.xAxis.min = s.start; o.xAxis.max = s.end;
  o.yAxis = {
    type: 'category', data: ['Hluboký', 'Lehký', 'REM', 'Bdění'],
    axisLabel: { color: css('--muted'), fontSize: 11 }, axisLine: { show: false }, axisTick: { show: false },
    splitLine: { show: true, lineStyle: { color: css('--grid') } },
  };
  o.tooltip = { ...o.tooltip, trigger: 'item', formatter: p => {
    const [st, en, , type] = p.value;
    return `${label[type]}<br>${time(st)}–${time(en)} · ${Math.round((new Date(en) - new Date(st)) / 60000)} min`;
  } };
  o.series = [{
    type: 'custom',
    data: s.stages.map(x => [x.start, x.end, STAGE_ROW[x.stage], x.stage]),
    encode: { x: [0, 1], y: 2 },
    renderItem: (params, api) => {
      const a = api.coord([api.value(0), api.value(2)]);
      const b = api.coord([api.value(1), api.value(2)]);
      const h = api.size([0, 1])[1] * 0.7;
      return {
        type: 'rect',
        shape: { x: a[0], y: a[1] - h / 2, width: Math.max(b[0] - a[0] - 1, 1), height: h, r: 2 },
        style: { fill: color[s.stages[params.dataIndex].stage] },
      };
    },
  }];
  chart('c-sleep').setOption(o, true);
  $('sleep-legend').innerHTML = STAGES.map(x =>
    `<span><i style="background:${css(x.color)}"></i>${x.label} ${fmt(s.stage_minutes[x.key])} min</span>`).join('');
}

function stepsChart(d) {
  const o = base();
  o.xAxis.min = d.date + 'T00:00:00'; o.xAxis.max = d.range[1];
  o.yAxis.scale = false;
  o.tooltip.formatter = ps => `${time(ps[0].value[0])}<br><b>${fmt(ps[0].value[1])}</b> kroků`;
  o.series = [{ type: 'bar', data: d.steps, barWidth: '60%', itemStyle: { color: css('--s1'), borderRadius: [3, 3, 0, 0] } }];
  chart('c-steps').setOption(o, true);
}

function pointChart(id, data, unit, digits, maxGapMin) {
  const o = base();
  data = withGaps(data, maxGapMin);
  o.tooltip.formatter = ps => ps[0].value[1] == null ? '' : `${time(ps[0].value[0])}<br><b>${fmt(ps[0].value[1], digits)}</b> ${unit}`;
  o.series = [{ type: 'line', data, symbol: 'none', lineStyle: { width: 1.5, color: css('--s1') }, itemStyle: { color: css('--s1') } }];
  chart(id).setOption(o, true);
}

// kind 'bar': an amount, drawn from zero. kind 'line': a level; the y-range is
// at least ±10 % of the mean so day-to-day noise doesn't look like a trend.
function trendChart(id, key, { kind = 'line', transform = v => v, digits = 0, unit = '' } = {}) {
  const o = base();
  const data = days.map(x => x[key] == null ? null : transform(x[key]));
  o.xAxis = { type: 'category', data: days.map(x => dayLabel(x.date)), axisLabel: { color: css('--muted'), fontSize: 11 },
    axisLine: { lineStyle: { color: css('--axis') } }, axisTick: { show: false } };
  o.grid.left = 44;
  o.tooltip.formatter = ps => `${ps[0].name}<br><b>${ps[0].value == null ? '–' : fmt(ps[0].value, digits)}</b> ${unit}`;
  if (kind === 'bar') {
    o.yAxis.scale = false;
    o.series = [{ type: 'bar', data, barMaxWidth: 28, itemStyle: { color: css('--s1'), borderRadius: [4, 4, 0, 0] } }];
  } else {
    const vals = data.filter(v => v != null);
    const mean = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
    const pad = Math.abs(mean) * 0.1;
    o.yAxis.min = Math.floor(Math.min(...vals, mean - pad));
    o.yAxis.max = Math.ceil(Math.max(...vals, mean + pad));
    o.series = [{
      type: 'line', data, connectNulls: false,
      symbol: 'circle', symbolSize: 8, lineStyle: { width: 2, color: css('--s1') },
      itemStyle: { color: css('--s1'), borderColor: css('--surface'), borderWidth: 2 },
    }];
  }
  chart(id).setOption(o, true);
}

function table() {
  const cols = [
    ['Den', x => dayLabel(x.date)], ['Klidový tep', x => fmt(x.resting_hr)], ['HRV ms', x => fmt(x.hrv_ms, 1)],
    ['Spánek', x => hm(x.sleep_minutes)], ['Hluboký', x => fmt(x.sleep_deep_minutes)], ['REM', x => fmt(x.sleep_rem_minutes)],
    ['Kroky', x => fmt(x.steps)], ['AZM', x => fmt(x.azm)], ['Aktivní kcal', x => fmt(x.active_kcal)],
    ['Tep min/prům/max', x => x.hr_avg == null ? '–' : `${fmt(x.hr_min)} / ${fmt(x.hr_avg)} / ${fmt(x.hr_max)}`],
    ['SpO₂ %', x => fmt(x.spo2_avg, 1)], ['Dech', x => fmt(x.respiratory_rate, 1)], ['Noční tepl. °C', x => fmt(x.nightly_temp_c, 1)],
  ];
  $('table').innerHTML = `<thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${
    [...days].reverse().map(x => `<tr data-date="${x.date}">${cols.map(c => `<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  for (const tr of $('table').querySelectorAll('tbody tr')) tr.onclick = () => selectDay(tr.dataset.date);
}

async function selectDay(date) {
  selected = date;
  for (const b of $('days').children) b.setAttribute('aria-pressed', b.dataset.date === date);
  const i = days.findIndex(x => x.date === date);
  tiles(days[i] || {}, days[i - 1]);
  $('day-title').textContent = new Date(date + 'T12:00').toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const d = await api(`/api/day/${date}`);
  hrChart(d);
  sleepChart(d);
  stepsChart(d);
  pointChart('c-spo2', d.spo2, '%', 1, 10);
  pointChart('c-hrv', d.hrv, 'ms', 1, 15);
}

// A 401 means the session expired: sign in again.
async function api(url) {
  const r = await fetch(url);
  if (r.status === 401) { location.href = '/auth/login'; throw new Error('signed out'); }
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

// "Reconnect" only when the last job run could not use the refresh token.
function showSyncStatus(last) {
  const banner = $('banner');
  const justConnected = new URLSearchParams(location.search).has('fitbit');
  if (justConnected) {
    banner.innerHTML = '<span>Přístup k datům je obnovený. Chybějící dny se doplní při příštím běhu synchronizace (denně v 10:00).</span>';
    history.replaceState(null, '', '/');
  } else if (last && last.auth_error) {
    banner.innerHTML = '<span>Synchronizace nemá přístup k datům z Google Health, nová data nepřibývají.</span>'
      + '<a href="/auth/fitbit">Obnovit přístup k datům</a>';
  }
  banner.hidden = !(justConnected || last?.auth_error);
  if (last?.run_at) {
    const t = new Date(last.run_at);
    $('status').title = `Poslední synchronizace ${t.toLocaleString('cs-CZ')}${last.ok ? '' : ' (selhala)'}`;
  }
}

async function load() {
  $('status').textContent = 'Načítám…';
  const overview = await api('/api/overview');
  showSyncStatus(overview.lastSync);
  days = overview.days.filter(x => x.hr_avg != null || x.sleep_minutes != null);
  $('status').textContent = days.length ? `${days.length} ${days.length === 1 ? 'den' : days.length < 5 ? 'dny' : 'dní'} dat` : '';
  if (!days.length) { $('tiles').innerHTML = '<div class="empty">Zatím žádná data. Spusť <code>fitdata backfill</code> a <code>fitdata load</code>.</div>'; return; }
  $('days').innerHTML = days.map(x => `<button data-date="${x.date}">${dayLabel(x.date)}</button>`).join('');
  for (const b of $('days').children) b.onclick = () => selectDay(b.dataset.date);
  trendChart('t-rhr', 'resting_hr', { unit: 'tepů/min' });
  trendChart('t-hrv', 'hrv_ms', { digits: 1, unit: 'ms' });
  trendChart('t-sleep', 'sleep_minutes', { kind: 'bar', transform: v => Math.round(v / 6) / 10, digits: 1, unit: 'h' });
  trendChart('t-steps', 'steps', { kind: 'bar', unit: 'kroků' });
  table();
  await selectDay(days.some(x => x.date === selected) ? selected : days[days.length - 1].date);
}

window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => selected && load());
load();
</script>
