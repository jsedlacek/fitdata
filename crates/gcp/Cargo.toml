[package]
name = "fitdata-gcp"
version = "0.1.0"
edition = "2024"

# Google Cloud clients, in their own crate: each client instantiates every
# RPC of its service (through its dyn stub), and here that code is compiled
# once rather than with every change to fitdata.

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
google-cloud-gax = "1.15.0"
google-cloud-kms-v1 = "1.16.0"
google-cloud-secretmanager-v1 = "1.14.0"
google-cloud-storage = "1.21.0"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
