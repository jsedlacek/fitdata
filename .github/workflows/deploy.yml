# Deploys every push to main with deploy/deploy.sh. Authenticates keyless as
# fitdata-deployer via Workload Identity Federation (set up by deploy/setup.sh).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Pinned: the binary is built here and must run on the image's glibc
    # (Dockerfile.ci).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy.sh tags the image by the last commit that touched its sources.
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/127000208622/locations/global/workloadIdentityPools/github/providers/github
          service_account: fitdata-deployer@fitdata-jsedlacek.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta
      # The image is built here rather than in Cloud Build: the runner would
      # only wait for it anyway, and rust-cache keeps the compiled crates
      # between deploys, so a changed dependency rebuilds only what uses it.
      - id: image
        run: |
          source deploy/config.sh
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=$REGION-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@1.99
      - if: steps.image.outputs.exists != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.image.outputs.exists != 'true'
        run: cargo build --release --locked
      - if: steps.image.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.image.outputs.exists != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - if: steps.image.outputs.exists != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.image.outputs.image }}
          # A plain image manifest, without an attestation index.
          provenance: false
      - run: deploy/deploy.sh
